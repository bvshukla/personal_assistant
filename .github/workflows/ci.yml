name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd personal_assistant
          npm ci

      - name: Lint
        run: |
          cd personal_assistant
          npm run lint

      - name: Test
        env:
          NODE_ENV: test
        run: |
          cd personal_assistant
          npm test
